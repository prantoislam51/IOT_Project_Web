; Smart Attendance Display — ESP32-S3 N16R8 + 16x2 I2C LCD
; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/platforms/espressif32.html

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8 = 16MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.2.0
    bblanchon/ArduinoJson@^7.0.4
